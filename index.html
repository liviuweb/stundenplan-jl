<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECE9E2">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KahloGames">
<title>KahloGames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Dancing+Script:wght@700&family=Fredoka:wght@400;500;600;700&family=Bungee&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Rubik:wght@400;500;700;800&family=Cinzel:wght@500;700;800&family=Alegreya+SC:wght@500;700;800&family=Alegreya:wght@400;500;700&family=Bitter:wght@400;600;800&family=Orbitron:wght@600;800&family=Big+Shoulders+Stencil+Display:wght@700;900&display=swap" rel="stylesheet">
<script>
  // Lädt Dateien aus Unterordnern (css/, js/, assets/) – oder, falls alles in einem Ordner liegt, direkt daneben.
  (function () {
    function tryLoad(paths, make, done) {
      var i = 0;
      (function next() {
        if (i >= paths.length) { done && done(null); return; }
        var p = paths[i++], el = make(p);
        el.onload = function () { done && done(p); };
        el.onerror = function () { el.remove(); next(); };
        document.head.appendChild(el);
      })();
    }
    var css = function (p) { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = p; return l; };
    var js = function (p) { var s = document.createElement('script'); s.src = p; return s; };
    ['app.css', 'floriferous.css', 'games.css'].forEach(function (f) { tryLoad(['css/' + f, f], css); });
    tryLoad(['assets/icon.svg', 'icon.svg'], function (p) { var l = document.createElement('link'); l.rel = 'icon'; l.type = 'image/svg+xml'; l.href = p; return l; });
    tryLoad(['js/config.js', 'config.js'], js, function () {
      var paths = ['js/app.bundle.js', 'app.bundle.js'], i = 0;
      (function next() {
        if (i >= paths.length) { document.getElementById('app').innerHTML = '<p style="font:16px system-ui;padding:40px 22px;color:#B42318">Die Datei app.bundle.js wurde nicht gefunden. Bitte alle Dateien hochladen.</p>'; return; }
        var p = paths[i++];
        window.KG_ASSETS = p.indexOf('js/') === 0 ? 'assets/flori/' : '';
        var s = js(p); s.onerror = function () { s.remove(); next(); }; document.head.appendChild(s);
      })();
    });
  })();
</script>
</head>
<body class="hub">
<div id="app"><p style="font:16px system-ui;color:#6D6A63;padding:40px 22px">Lade KahloGames …</p></div>
<noscript>Diese Seite braucht JavaScript.</noscript>
<script>
  // Fehler sichtbar anzeigen statt einer weißen Seite
  window.addEventListener('error', function (e) {
    var a = document.getElementById('app');
    if (a && !a.dataset.ok) a.innerHTML = '<div style="font:15px system-ui;padding:40px 22px;color:#B42318">Die Seite konnte nicht starten.<br><small style="color:#6D6A63">' + (e.message || 'Unbekannter Fehler') + ' (' + (e.filename || '').split('/').pop() + ')</small></div>';
  });
</script>
<script>setTimeout(function(){if(!document.getElementById("app").dataset.ok){document.getElementById("app").innerHTML="<p style=\"font:16px system-ui;padding:24px\">Die Seite konnte nicht geladen werden. Bitte über die GitHub-Pages-Adresse öffnen oder die Seite neu laden.</p>";}},4000);</script>
</body>
</html>
