/* Layout: weiche, runde Karten auf zart getöntem Grund; Tagesleiste + Zeitstrahl als Herzstück; unten eine Daumen-Navigation am Handy. Farbwelt wählbar (Rosé, Flieder, Salbei, Ozean). */
:root{
  --bg:#fbf3f5; --surface:#ffffff; --ink:#2c1e27; --muted:#7c6672; --line:#f0dfe6; --accent:#bf3f6c; --accent-soft:#fbe3ec; --on-accent:#ffffff;
  --deutsch:#d9534f; --mathe:#4f74d8; --sach:#3f9a6e; --biwi:#d39a1e; --andere:#8a6fd1; --uni:#1f8794; --arbeit:#5d6b8a;
  --ok:#2f8a57; --wait:#b0741a; --todo:#c4412a;
  --f-display:"Nunito", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px; color-scheme:light;
}
:root[data-pal="flieder"]{--bg:#f6f3fc;--surface:#ffffff;--ink:#251f33;--muted:#6f6787;--line:#e6def5;--accent:#7650c2;--accent-soft:#ece4fb;--on-accent:#ffffff}
:root[data-pal="salbei"]{--bg:#f2f7f3;--surface:#ffffff;--ink:#1d2a23;--muted:#61756a;--line:#dbe8df;--accent:#3a7a5d;--accent-soft:#deefe5;--on-accent:#ffffff}
:root[data-pal="ozean"]{--bg:#f1f6fc;--surface:#ffffff;--ink:#1b2535;--muted:#5f6d84;--line:#dbe5f3;--accent:#2c67b0;--accent-soft:#dde9f9;--on-accent:#ffffff}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1b1418;--surface:#261c22;--ink:#f7eaf0;--muted:#c2a8b6;--line:#3b2b34;--accent:#f28db3;--accent-soft:#3e2531;--on-accent:#2a1520;
    --deutsch:#f07f78;--mathe:#86a4f2;--sach:#6fc69a;--biwi:#eebd55;--andere:#b6a0f2;--uni:#5cc6d1;--arbeit:#a3b0cf;--ok:#66c98f;--wait:#e8b05c;--todo:#f08a6c;color-scheme:dark}
  :root:not([data-theme="light"])[data-pal="flieder"]{--bg:#17141f;--surface:#211c2c;--ink:#efe9fb;--muted:#ada3c6;--line:#342c45;--accent:#bba2f4;--accent-soft:#30264a;--on-accent:#1c1430}
  :root:not([data-theme="light"])[data-pal="salbei"]{--bg:#121a16;--surface:#1a241f;--ink:#e6f2ea;--muted:#9db6a8;--line:#2b3a32;--accent:#86cba8;--accent-soft:#213a2e;--on-accent:#0f1d16}
  :root:not([data-theme="light"])[data-pal="ozean"]{--bg:#111722;--surface:#19212f;--ink:#e6edf8;--muted:#9eacc4;--line:#2a3448;--accent:#8db6f2;--accent-soft:#1f3150;--on-accent:#0e1828}
}
:root[data-theme="dark"]{--bg:#1b1418;--surface:#261c22;--ink:#f7eaf0;--muted:#c2a8b6;--line:#3b2b34;--accent:#f28db3;--accent-soft:#3e2531;--on-accent:#2a1520;
  --deutsch:#f07f78;--mathe:#86a4f2;--sach:#6fc69a;--biwi:#eebd55;--andere:#b6a0f2;--uni:#5cc6d1;--arbeit:#a3b0cf;--ok:#66c98f;--wait:#e8b05c;--todo:#f08a6c;color-scheme:dark}
:root[data-theme="dark"][data-pal="flieder"]{--bg:#17141f;--surface:#211c2c;--ink:#efe9fb;--muted:#ada3c6;--line:#342c45;--accent:#bba2f4;--accent-soft:#30264a;--on-accent:#1c1430}
:root[data-theme="dark"][data-pal="salbei"]{--bg:#121a16;--surface:#1a241f;--ink:#e6f2ea;--muted:#9db6a8;--line:#2b3a32;--accent:#86cba8;--accent-soft:#213a2e;--on-accent:#0f1d16}
:root[data-theme="dark"][data-pal="ozean"]{--bg:#111722;--surface:#19212f;--ink:#e6edf8;--muted:#9eacc4;--line:#2a3448;--accent:#8db6f2;--accent-soft:#1f3150;--on-accent:#0e1828}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.01em;text-wrap:balance;margin:0}

.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:900;font-size:1.15rem}
.logo i{width:30px;height:30px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent);font-style:normal;font-size:.9rem}
.navtop{display:flex;gap:4px;background:var(--surface);border-radius:999px;padding:4px;box-shadow:0 1px 0 var(--line),0 6px 20px -12px color-mix(in srgb,var(--accent) 40%,transparent)}
.navtop button,.navbot button{border:0;background:transparent;border-radius:999px;font-weight:700;color:var(--muted)}
.navtop button{padding:8px 18px}
.navtop button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:var(--surface);display:grid;place-items:center;color:var(--muted);box-shadow:0 1px 0 var(--line)}
.iconbtn svg{width:22px;height:22px}
.navbot{display:none}
@media (max-width:760px){
  .navtop{display:none}
  .navbot{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));justify-content:space-around}
  .navbot button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;font-size:.78rem;min-width:70px}
  .navbot svg{width:24px;height:24px}
  .navbot button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
  main.wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px)) !important}
}
main.wrap{padding-block:8px 56px}

.hello{display:flex;flex-direction:column;gap:2px;margin:8px 0 18px}
.hello h1{font-weight:900;font-size:clamp(1.7rem,4.5vw,2.3rem);line-height:1.1}
.hello p{margin:0;color:var(--muted);font-size:1.02rem}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px}
.box{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:0 1px 0 var(--line)}
.box h2{font-weight:900;font-size:1.15rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.soft{color:var(--muted)}
.small{font-size:.88rem}

/* Day strip */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:16px}
.days button{border:0;background:var(--surface);border-radius:var(--r-md);padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 1px 0 var(--line);min-height:68px}
.days b{font-family:var(--f-display);font-weight:900;font-size:1.25rem;line-height:1.1}
.days span{font-size:.78rem;color:var(--muted);font-weight:600}
.days .dots{display:flex;gap:3px;height:6px;margin-top:3px}
.days .dots i{width:6px;height:6px;border-radius:50%;background:var(--s)}
.days button.is-today span:first-child{color:var(--accent)}
.days button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.days button[aria-pressed="true"] span{color:inherit;opacity:.85}
.days button[aria-pressed="true"] .dots i{background:var(--on-accent)}

[data-s="mathe"]{--s:var(--mathe)} [data-s="deutsch"]{--s:var(--deutsch)} [data-s="sach"]{--s:var(--sach)} [data-s="biwi"]{--s:var(--biwi)} [data-s="andere"]{--s:var(--andere)} [data-s="uni"]{--s:var(--uni)} [data-s="arbeit"]{--s:var(--arbeit)} [data-s="date"]{--s:var(--accent)}
/* Plan switcher */
.who{display:flex;gap:4px;background:var(--surface);border-radius:999px;padding:4px;box-shadow:0 1px 0 var(--line)}
.who button{border:0;background:transparent;border-radius:999px;padding:5px 12px 5px 5px;display:flex;align-items:center;gap:7px;font-weight:700;color:var(--muted);font-size:.92rem;min-height:38px}
.who button i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:.82rem;background:var(--bg);color:var(--muted);font-family:var(--f-display)}
.who button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.who button[aria-pressed="true"] i{background:var(--accent);color:var(--on-accent)}
/* Secrets */
.pixh{display:block;width:100%;height:auto;shape-rendering:crispEdges}
.who .herz{border:0;background:transparent;padding:0;width:22px;min-height:38px;display:grid;place-items:center;color:var(--accent);position:relative;flex:none}
.who .herz .pixh{width:13px}
.who .herz.pop .pixh{animation:herzpop .5s ease-out}
.who .paar{display:flex;align-items:center;gap:7px;padding:0 12px;min-height:38px;font-family:var(--f-display);font-weight:800;color:var(--accent);white-space:nowrap}
.who .paar .pixh{width:12px}
.flyh2{position:fixed;z-index:80;pointer-events:none;color:var(--accent);transform-origin:50% 50%;will-change:transform;filter:drop-shadow(0 6px 14px color-mix(in srgb,var(--accent) 35%,transparent))}
.flyh2 .pixh{width:100%}
.flyh{position:fixed;width:12px;pointer-events:none;color:var(--accent);z-index:60;animation:flyh 1.1s ease-out forwards}
@keyframes herzpop{40%{transform:scale(1.45)}}
@keyframes flyh{0%{opacity:0;transform:translate(-50%,0)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-46px)}}
.wir{display:flex;align-items:center;gap:7px;color:var(--accent);font-weight:600;font-size:.88rem;margin:-6px 0 12px}
.wir .pixh{width:11px;flex:none}
.von{display:inline-flex;align-items:center;gap:5px;color:var(--accent) !important;font-size:.8rem !important;font-weight:600;margin-top:2px}
.von .pixh{width:10px}
.widmung{text-align:center;color:var(--muted);font-size:.82rem;margin:4px 0 0;display:flex;align-items:center;justify-content:center;gap:6px}
.widmung .pixh{width:10px;color:var(--accent)}
.gate-mark .pixh{width:30px;color:var(--on-accent)}
.gate .unter{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-top:-6px}
@media (prefers-reduced-motion:reduce){.who .herz.pop .pixh,.flyh{animation:none}}
.iconbtn{position:relative}
.sdot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--wait);box-shadow:0 0 0 2px var(--surface)}
.syncline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;background:var(--bg);border-radius:var(--r-md);padding:10px 12px;font-size:.9rem}
.syncline b{display:inline-flex;align-items:center;gap:7px}
.syncline b::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--st,var(--muted))}
.gate-who{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gate-who button{border:0;background:var(--surface);border-radius:var(--r-lg);padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:1.05rem;box-shadow:0 1px 0 var(--line)}
.gate-who button i{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-weight:900;font-size:1.4rem}
@media (max-width:760px){.logo span{display:none}.top .wrap{gap:8px}}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;color:var(--s)}
.tag::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--s)}

/* Hero card */
.hero{border-radius:var(--r-lg);padding:20px;background:color-mix(in srgb,var(--s) 16%,var(--surface));position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:color-mix(in srgb,var(--s) 18%,transparent)}
.hero>*{position:relative;z-index:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--s);font-weight:800;font-size:.85rem;padding:5px 12px;border-radius:999px}
.pill.live::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.pill.live::before{animation:none}}
.hero h3{font-weight:900;font-size:clamp(1.3rem,3.6vw,1.65rem);line-height:1.15;margin:12px 0 12px}
.where{display:flex;flex-wrap:wrap;gap:8px}
.where span{background:var(--surface);border-radius:var(--r-sm);padding:7px 11px;font-weight:600;font-size:.92rem}
.where span small{display:block;color:var(--muted);font-weight:500;font-size:.75rem;line-height:1.2}
.bar{height:8px;border-radius:4px;background:color-mix(in srgb,var(--surface) 70%,transparent);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--s);border-radius:4px}

/* Timeline */
.tl{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:var(--surface);border-radius:var(--r-md);padding:12px 14px 12px 12px;box-shadow:0 1px 0 var(--line);min-height:64px}
.ev:hover{box-shadow:0 0 0 2px color-mix(in srgb,var(--s) 45%,transparent)}
.ev .t{font-weight:700;line-height:1.25;font-size:.95rem}
.ev .t small{display:block;color:var(--muted);font-weight:500;font-size:.82rem}
.ev .b{min-width:0;display:flex;flex-direction:column;gap:3px;border-left:4px solid var(--s);padding-left:12px}
.ev .n{font-weight:700;line-height:1.3}
.ev .m{color:var(--muted);font-size:.86rem}
.ev .chev{color:var(--muted);font-size:1.2rem}
.ev.past{opacity:.5}
.ev.live{box-shadow:0 0 0 2px var(--s)}
.ev.off .n{text-decoration:line-through;color:var(--muted)}
.ev.off .b{border-left-color:var(--line)}
.ev.opt{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.ev.opt .b{border-left-style:dashed}
.flag{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:999px;margin-top:2px;width:max-content;max-width:100%}
.flag.todo{background:color-mix(in srgb,var(--todo) 14%,transparent);color:var(--todo)}
.flag.wait{background:color-mix(in srgb,var(--wait) 16%,transparent);color:var(--wait)}
.flag.off{background:var(--bg);color:var(--muted)}
.flag.opt{background:var(--accent-soft);color:var(--accent)}
.gap{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.86rem;padding:2px 0 2px 74px}
.gap::before{content:"";width:2px;height:22px;border-radius:1px;background:repeating-linear-gradient(to bottom,var(--line) 0 4px,transparent 4px 7px)}
.gap b{color:var(--ink);font-weight:600}
.done{text-align:center;padding:22px 16px;border-radius:var(--r-lg);background:var(--accent-soft);color:var(--accent);font-weight:700}
.done b{display:block;font-family:var(--f-display);font-weight:900;font-size:1.25rem}
@media (max-width:440px){.ev{grid-template-columns:54px minmax(0,1fr)}.ev .chev{display:none}.gap{padding-left:66px}}

/* Checklist */
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.check li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
.check li:first-child{border-top:0}
.cb{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;margin-top:1px}
.cb svg{width:16px;height:16px;opacity:0}
.cb[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cb[aria-checked="true"] svg{opacity:1}
.check .tx{min-width:0;font-size:.95rem}
.check .tx b{display:block;font-weight:700}
.check .tx span{color:var(--muted);font-size:.86rem}
.check li.is-done .tx{opacity:.5}
.check li.is-done .tx b{text-decoration:line-through}
.dot-ic{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:900;font-size:.9rem}
.x{border:0;background:transparent;color:var(--muted);font-size:1.2rem;line-height:1;padding:4px 6px;border-radius:8px}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-width:0;border:0;background:var(--bg);border-radius:var(--r-sm);padding:11px 13px}
.badge{background:var(--accent);color:var(--on-accent);font-family:var(--f-body);font-size:.78rem;font-weight:700;border-radius:999px;padding:1px 9px}

.btn{border:0;background:var(--bg);border-radius:var(--r-sm);padding:10px 16px;font-weight:700;font-size:.92rem;white-space:nowrap;min-height:42px}
.btn:hover{background:var(--accent-soft);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.84rem}
.btn.danger{color:var(--todo)}
.btn.danger.armed{background:var(--todo);color:var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px}

/* Week */
.wknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 16px}
.wknav h1{font-weight:900;font-size:clamp(1.4rem,4vw,1.9rem);margin-right:auto}
.wknav .iconbtn{font-size:1.3rem;font-weight:800}
.wklist{display:flex;flex-direction:column;gap:20px}
.wkctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:4px 0 2px}
.modes{display:flex;background:var(--surface);border-radius:999px;padding:3px;gap:2px;box-shadow:0 1px 0 var(--line)}
.modes button{border:0;background:transparent;border-radius:999px;display:flex;align-items:center;gap:5px;padding:6px 11px;font-weight:700;font-size:.8rem;color:var(--muted);min-height:34px}
.modes svg{width:16px;height:16px}
.modes button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
/* Zeitraster */
.tg{background:var(--surface);border-radius:var(--r-lg);box-shadow:0 1px 0 var(--line);overflow:clip}
.tg-head,.tg-body{display:grid;grid-template-columns:var(--hw,52px) repeat(var(--cols),minmax(0,1fr))}
.tg-week{--hw:30px}

function catsOf(plan){
  plan=plan||state;
  const list=(plan.cats||[]).map(x=>({...x}));const have=new Set(list.map(x=>x.id));
  const used=new Set((plan===state?courses():plan.courses).map(c=>c.subject).filter(x=>x&&x!=='date'));
  Object.keys(DEF_CATS).forEach(id=>{if(!have.has(id)&&(used.has(id)||(!plan.cats&&id==='andere'))){list.push({id,n:SUBJ[id],c:DEF_CATS[id]});have.add(id);}});
  used.forEach(id=>{if(!have.has(id)){list.push({id,n:SUBJ[id]||id,c:'grau'});have.add(id);}});
  if(!list.length)list.push({id:'andere',n:SUBJ.andere,c:DEF_CATS.andere});
  return list;
}
const catName=(id,plan)=>{if(id==='date')return 'Date';const x=catsOf(plan).find(c=>c.id===id);return x?x.n:(SUBJ[id]||'');};
function lighten(h,a){const n=parseInt(h.slice(1),16);const f=v=>Math.round(v+(255-v)*a).toString(16).padStart(2,'0');return '#'+f(n>>16&255)+f(n>>8&255)+f(n&255);}
function catColors(c){if(CAT_PAL[c])return CAT_PAL[c];if(/^#[0-9a-f]{6}$/i.test(c||''))return [c,lighten(c,.38)];return CAT_PAL.grau;}
function applyCatCSS(){
  let el=document.getElementById('catcss');if(!el){el=document.createElement('style');el.id='catcss';document.head.appendChild(el);}
  const L=[],D=[];catsOf(state).forEach(x=>{if(!/^[a-z0-9_-]+$/i.test(x.id))return;const [l,d]=catColors(x.c);L.push(`[data-s="${x.id}"]{--s:${l}}`);D.push(`[data-s="${x.id}"]{--s:${d}}`);});
  const css=L.join('')+`@media (prefers-color-scheme: dark){${D.map(r=>':root:not([data-theme="light"]) '+r).join('')}}`+D.map(r=>':root[data-theme="dark"] '+r).join('');
  if(el.textContent!==css)el.textContent=css;
}
function catsEdit(){if(!state.cats)state.cats=catsOf(state).map(({id,n,c})=>({id,n,c}));return state.cats;}
function catFallback(not){const cs=catsOf(state).filter(c=>c.id!==not);return (cs.find(c=>c.id==='andere')||cs[0]||{id:'andere'}).id;}
function newCatId(){return 'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function freeColor(){const cs=catsOf(state);return Object.keys(CAT_PAL).find(k=>!cs.some(c=>c.c===k))||'rose';}
function setSubject(c,sid){if(c.source==='portal'){state.subjP=state.subjP||{};state.subjP[c.id]=sid;}c.subject=sid;}
function palHTML(sel){
  const own=!CAT_PAL[sel]&&/^#[0-9a-f]{6}$/i.test(sel||'');
  return `<div class="palrow" role="group" aria-label="Farbe">${Object.entries(CAT_PAL).map(([k,v])=>`<button type="button" class="pdot" data-action="catcol" data-c="${k}" aria-pressed="${sel===k}" aria-label="${v[2]}" title="${v[2]}" style="--l:${v[0]};--d:${v[1]}"></button>`).join('')}<label class="pdot own" title="Eigene Farbe" aria-pressed="${own}"${own?` style="--l:${sel};--d:${lighten(sel,.38)}"`:''}><input type="color" class="pown" aria-label="Eigene Farbe" value="${own?sel:'#c2477a'}"></label><input type="hidden" class="pcol" value="${esc(sel)}"></div>`;
}

    let changed=false;const seen=new Set();

      seen.add(row.id);const local=book.plans[row.id];
      if(local&&local._dirty)continue;

      try{const p=normPlan(await decryptB64(KEYS.enc,row.data));p._serverAt=row.updated_at;p._dirty=false;book.plans[row.id]=p;changed=true;}catch(e){}
    }

    if(wirRow&&(book.wir._serverAt!==wirRow.updated_at||book.wir._dirty)){
      try{
        const remote=normWir(await decryptB64(KEYS.enc,wirRow.data));
        const merged=mergeWir(book.wir,remote);
        const mc=JSON.stringify(cleanWir(merged));
        if(mc!==JSON.stringify(cleanWir(book.wir)))changed=true;
        merged._serverAt=wirRow.updated_at;merged._rev=book.wir._rev||0;merged._dirty=mc!==JSON.stringify(cleanWir(remote));
        book.wir=merged;

    }

    if(await pullFeeds(false))changed=true;
    if(changed){state=book.plans[prefs.view]||state;persist();if(sheet.hidden&&!typing())render();else pendingRender=true;scheduleReminders();}
    setSync('ok');

    const newer=(x.updatedAt||0)>=(y.updatedAt||0)?x:y,older=newer===x?y:x;

    let n=0;

const CODE_RE=/\b([A-Z]{2,8}\d{4,}[A-Z]?)\b/;

function diffFeeds(oldO,newO){
  const today=iso(new Date());const k=o=>normTitle(o.summary)+'@'+o.date;
  const om=new Map(),nm=new Map();
  oldO.filter(o=>o.date>=today).forEach(o=>om.set(k(o),o));newO.filter(o=>o.date>=today).forEach(o=>nm.set(k(o),o));
  const lbl=o=>{const d=fromIso(o.date);return `${DAYS[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}.`;};
  const T=o=>cleanOcc(o).title;
  const oldT=new Set(oldO.map(o=>normTitle(o.summary))),newT=new Set(newO.map(o=>normTitle(o.summary)));
  const groups=new Map();
  const add=(type,text,val,o)=>{const k=type+'|'+text+'|'+val;let g=groups.get(k);if(!g){g={type,text,val,items:[]};groups.set(k,g);}g.items.push(o);};
  for(const [key,n] of nm){const o=om.get(key);const nt=normTitle(n.summary);
    if(!o){if(!oldT.has(nt))add('new',`Neu im Plan: ${T(n)}`,`${hm(n.s)} Uhr`,n);else add('add',`Zusätzlicher Termin: ${T(n)}`,`${hm(n.s)}–${hm(n.e)}`,n);continue;}
    if(n.cancel&&!o.cancel)add('off',`Fällt aus: ${T(n)}`,'',n);
    else if(!n.cancel&&o.cancel)add('on',`Findet wieder statt: ${T(n)}`,'',n);
    if((n.location||'')!==(o.location||''))add('room',`Neuer Raum: ${T(n)}`,n.location||'Raum offen',n);
    if(n.s!==o.s||n.e!==o.e)add('time',`Neue Uhrzeit: ${T(n)}`,`${hm(n.s)}–${hm(n.e)}`,n);
  }
  for(const [key,o] of om){if(nm.has(key))continue;const ot=normTitle(o.summary);
    if(!newT.has(ot))add('gone',`Nicht mehr im Plan: ${T(o)}`,'',o);else add('off',`Termin entfällt: ${T(o)}`,'',o);}
  const prio={new:0,gone:1,off:2,room:3,time:4,add:5,on:6};
  return [...groups.values()].sort((a,b)=>prio[a.type]-prio[b.type]).map(g=>{
    const its=g.items.sort((a,b)=>a.date<b.date?-1:1);const n=its.length;

    if(g.type==='new')sub=`ab ${lbl(its[0])}, ${g.val}`;

    else sub=`${n} Termine ab ${lbl(its[0])}`+(g.val?' · '+g.val:'');
    return{type:g.type==='add'?'new':g.type,text:g.text,sub};
  });
}

function occursOn(c,d){
  if(c.hidden)return false;

  const ev=everyOf(c),wd=d.getDay(),s=iso(d);

  if(c.from&&s<c.from)return false;

  return true;

function milestone(){

function freeWindows(n){
  const out=[];const N=now();const ids=planIds();

const MODE_ICONS={liste:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".6"/><circle cx="4" cy="12" r=".6"/><circle cx="4" cy="18" r=".6"/></svg>',
  raster:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 10h18M3 15.5h18M9 4v17"/></svg>'};
function viewMode(which){const m=prefs&&prefs[which+'Mode'];return m==='liste'?'liste':'raster';}
function modeSwitch(which){
  const m=viewMode(which);
  return `<div class="modes" role="group" aria-label="Ansicht">${['liste','raster'].map(k=>`<button type="button" data-action="mode-view" data-which="${which}" data-mode="${k}" aria-pressed="${m===k}" aria-label="${k==='liste'?'Liste':'Zeitraster'}">${MODE_ICONS[k]}<span>${k==='liste'?'Liste':'Raster'}</span></button>`).join('')}</div>`;
}
function gridRange(days){let a=8*60,b=18*60;days.forEach(d=>occ(d).forEach(o=>{a=Math.min(a,o.s);b=Math.max(b,o.e);}));return{h0:Math.max(0,Math.floor(a/60)),h1:Math.min(24,Math.ceil(b/60))};}
function gridHTML(days,opt){
  const N=now();const ppm=opt.ppm;const {h0,h1}=gridRange(days);const H=(h1-h0)*60*ppm;
  const compact=days.length>1;
  let head='';
  if(opt.head)head=`<div class="tg-head"><div class="tg-tz">${compact?'':''}</div>${days.map(d=>{const t=iso(d)===N.iso;return `<button type="button" class="tg-day ${t?'today':''}" data-action="gotoday" data-date="${iso(d)}" aria-label="${DAYS_LONG[d.getDay()]} ${dLong(d)} öffnen"><span>${DAYS[d.getDay()]}</span><b>${d.getDate()}</b></button>`;}).join('')}</div>`;
  const ads=days.map(d=>allDay(iso(d)));
  if(ads.some(a=>a.length))head+=`<div class="tg-allday"><div class="tg-adl">${compact?'ganzt.':'ganztägig'}</div>${ads.map(a=>`<div class="tg-adc">${a.map(c=>`<button class="adchip" data-s="${esc(c.subject)}" data-action="detail" data-id="${esc(c.id)}">${esc(c.title)}${!compact&&c.chip&&c.chip!=='ganztägig'?` <small>${c.chip}</small>`:''}</button>`).join('')}</div>`).join('')}</div>`;
  let hours='';for(let h=h0;h<=h1;h++)hours+=`<span style="top:${(h-h0)*60*ppm}px">${compact?h:pad(h)+' Uhr'}</span>`;
  const cols=days.map(d=>{
    const l=occ(d);const ds=iso(d);const isT=ds===N.iso;const lanes=[];
    l.forEach(o=>{let k=lanes.findIndex(e=>e<=o.s);if(k<0){k=lanes.length;lanes.push(0);}lanes[k]=o.e;o.lane=k;});
    l.forEach(o=>{o.n=Math.max(...l.filter(x=>x.s<o.e&&x.e>o.s).map(x=>x.lane))+1;});
    let col=l.map(o=>{const c=o.c;const top=(o.s-h0*60)*ppm,h=Math.max(compact?26:30,(o.e-o.s)*ppm-3);
      const p=roomParts(o.room);const room=p?`${p.b}.${p.lvl}.${p.nr}`:(o.room?roomShort(o.room):(c.place||''));
      const past=isT&&o.e<=N.min;const tag=o.req?'Anfrage':o.off?'fällt aus':o.opt?'zur Wahl':o.moved?'anderer Raum':'';
      const roomy=h>=(compact?60:46);const narrow=compact&&o.n>1;
      return `<button class="tb ${o.off?'off':''} ${o.opt||o.req?'opt':''} ${past?'past':''} ${roomy?'':'tight'} ${narrow?'narrow':''}" data-s="${esc(c.subject)}" data-action="detail" data-id="${esc(c.id)}" data-date="${ds}" style="top:${top+1}px;height:${h}px;left:calc(${o.lane/o.n*100}% + 2px);width:calc(${100/o.n}% - ${o.n>1?4:6}px)">
        <span class="nm">${esc(c.title)}</span>${roomy&&!narrow?`<span class="tm">${compact?hm(o.s):`${hm(o.s)}–${hm(o.e)}${tag?' · '+tag:''}`}</span>${room&&!compact?`<span class="rm">${esc(room)}</span>`:''}`:''}</button>`;}).join('');
    if(isT&&N.min>=h0*60&&N.min<=h1*60)col+=`<div class="nowline" style="top:${(N.min-h0*60)*ppm}px"></div>`;
    return `<div class="tg-col ${isT&&compact?'today':''}" data-date="${ds}" data-h0="${h0}" data-ppm="${ppm}" style="height:${H}px">${col}</div>`;
  }).join('');
  return `<div lang="de" class="tg ${compact?'tg-week':'tg-day1'}" style="--cols:${days.length};--hh:${60*ppm}px">${head}<div class="tg-body"><div class="tg-hours" style="height:${H}px">${hours}</div>${cols}</div></div>`;
}
function viewWeek(){
  const N=now();
  const base=(N.d.getDay()===0||N.d.getDay()===6)?addDays(mondayOf(N.d),7):mondayOf(N.d);
  const mon=addDays(base,7*ui.week);const days=[0,1,2,3,4].map(i=>addDays(mon,i));
  [5,6].forEach(i=>{const d=addDays(mon,i);if(occ(d).length||allDay(iso(d)).length)days.push(d);});
  const mode=viewMode('week');
  let body;
  if(mode==='raster')body=gridHTML(days,{ppm:innerWidth<560?0.9:1.1,head:true});
  else body=`<div class="wklist">${days.map(d=>{const l=occ(d);const isT=iso(d)===N.iso;
    return `<section class="${isT?'today':''}"><h2>${DAYS_LONG[d.getDay()]} <small>${dLong(d)}${isT?' · heute':''}</small></h2>${l.length?`<div class="tl">${withGaps(l,isT?N:null)}</div>`:'<div class="free">Frei</div>'}</section>`;}).join('')}</div>`;
  return `<div class="wknav">
      <h1>${isMine()?'':esc(gen(state.name))+' '}Woche ${isoWeek(mon)}<span class="soft" style="font-family:var(--f-body);font-weight:600;font-size:.95rem;display:block">${dLong(days[0])} – ${dLong(days[days.length-1])}</span></h1>
      <div class="wkctl">
        ${modeSwitch('week')}
        ${ui.week!==0?'<button class="btn sm" data-action="wk" data-d="0">Heute</button>':''}
        <button class="iconbtn" data-action="wk" data-d="-1" aria-label="Vorige Woche">‹</button>
        <button class="iconbtn" data-action="wk" data-d="1" aria-label="Nächste Woche">›</button>
        <button class="addbtn" data-action="newat" data-date="${ui.week===0&&days.some(d=>iso(d)===N.iso)?N.iso:iso(days[0])}" aria-label="Termin hinzufügen">+</button>
      </div>
    </div>
    ${body}`;
}

function nextDateOf(c){if(c.source!=='portal'){const t=iso(new Date());for(let i=0;i<120;i++){const d=addDays(new Date(),i);if(occursOn({...c,hidden:false},d))return iso(d);}return c.from||t;}const ds=Object.keys(c.dates).sort();const t=iso(new Date());return ds.find(x=>x>=t)||ds[ds.length-1];}
function viewCourses(){
  const all=courses();const vis=all.filter(c=>!c.hidden);
  const n=k=>new Set(vis.filter(c=>c.status===k).map(c=>c.code||c.title)).size;
  const groups=catsOf(state).map(x=>x.id).map(s=>{
    const cs=all.filter(c=>c.subject===s).sort((a,b)=>(a.source==='portal')-(b.source==='portal')||everyOf(a)-everyOf(b)||a.day-b.day||toMin(a.start)-toMin(b.start));

    return `<section class="cgrp"><h2><span class="tag" data-s="${esc(s)}" style="font-size:1rem">${esc(catName(s))}</span></h2>${cs.map(c=>{const {s:a,e}=eff(c);const st=STATUS[c.status]||STATUS.unklar;const P=c.source==='portal';

          <div class="m">${esc(rhythm(c))} · ${hm(a)}–${hm(e)}${c.group?' · '+esc(c.group):''}${c.hidden?' · ausgeblendet':(c.status!=='eigener'?' · '+st.label:'')}${P?' · aus dem Portal':''}</div></button>
        <button class="btn sm" data-action="togglehide" data-id="${esc(c.id)}">${c.hidden?'Einblenden':'Ausblenden'}</button></div>`;}).join('')}</section>`;
  }).join('');
  const counts=n('zugelassen')+n('angemeldet')+n('vorgemerkt')?`<div class="counts"><span><b>${n('zugelassen')}</b> zugelassen</span><span><b>${n('angemeldet')}</b> warten auf Zulassung</span><span><b>${n('vorgemerkt')}</b> noch nicht belegt</span></div>`:'';
  return `<div class="ctop"><h1>${isMine()?'Meine Kurse':esc(gen(state.name))+' Kurse'}</h1><button class="btn primary" data-action="new">+ Termin hinzufügen</button></div>
    ${counts}${groups}`;
}

function untilTxt(ds){const dd=Math.round((fromIso(ds)-fromIso(iso(new Date())))/864e5);

function examItem(x){const X=EXAM_T[x.type]||EXAM_T.klausur;return{id:'x:'+x.id,source:'exam',title:`${X.n}: ${x.title}`,subject:x.subject||'andere',kind:'E',room:x.room||'',place:x.place||'',status:'eigener',note:x.note||'',exam:x,

function examRow(x,opt){
  opt=opt||{};const X=EXAM_T[x.type]||EXAM_T.klausur;const d=fromIso(x.date);const dd=daysTo(x.date);const past=dd<0;

async function feedConnect(url){
  const btn=document.getElementById('feedBtn');
  if(!/^https:\/\/\S+$/i.test(url)&&!/^webcal:\/\/\S+$/i.test(url)){feedMsg('Das sieht nicht wie ein Link aus. Er beginnt mit https://',true);return;}
  url=url.replace(/^webcal:/i,'https:');
  if(btn){btn.disabled=true;btn.textContent='Verbinde …';}
  try{
    const rows=await rpc('set_feed',{p_key:KEYS.token,p_plan:prefs.view,p_url:url});const r=rows&&rows[0];
    if(r&&r.ics){applyFeed(prefs.view,r.ics,r.fetched_at,true);}
    const f=loadFeed(prefs.view);f.hasUrl=true;f.error=r?r.error:null;saveFeed(prefs.view);
    ui.feedEdit=false;render();refreshPortal();
    if(f.error)feedMsg('',false);
  }catch(e){if(btn){btn.disabled=false;btn.textContent='Verbinden';}feedMsg('Keine Verbindung zum Speicher. Bist du online?',true);}
}

    if(o&&o.value){if(!ti.value.trim()||ti.dataset.auto)ti.value=o.value,ti.dataset.auto='1';if(o.dataset.s&&[...su.options].some(x=>x.value===o.dataset.s)){su.value=o.dataset.s;document.getElementById('w-ecat').hidden=true;}}return;}
  if(ev.target.id==='f-subject'){const w=document.getElementById('w-newcat');if(w){w.hidden=ev.target.value!=='__new';if(!w.hidden)document.getElementById('f-catname').focus();}return;}
  if(ev.target.id==='n-lead'){setN('lead',+ev.target.value);return;}
  if(ev.target.id==='n-req'||ev.target.id==='n-ans'||ev.target.id==='n-quiet'){setN(ev.target.id.slice(2),ev.target.checked);return;}
  if(ev.target.id==='icsFile'&&ev.target.files[0]){feedFile(ev.target.files[0]);return;}
  if(ev.target.id!=='importFile'||!ev.target.files[0])return;
  const r=new FileReader();
  r.onload=()=>{try{const o=normBook(JSON.parse(r.result));if(!o)throw 0;
    Object.keys(o.plans).forEach(id=>{const old=book.plans[id];o.plans[id]._rev=((old&&old._rev)||0)+1;o.plans[id]._dirty=true;o.plans[id]._serverAt=old&&old._serverAt;});
    book=o;if(!book.plans[prefs.view])prefs.view=planIds()[0];if(!book.plans[prefs.me])prefs.me=planIds()[0];state=book.plans[prefs.view];persist();planIds().forEach(schedulePush);render();backupMsg('Sicherung geladen.');
  }catch(e){backupMsg('Diese Datei ist keine Stundenplan-Sicherung.',true);}};
  r.readAsText(ev.target.files[0]);
});
document.addEventListener('submit',ev=>{
  ev.preventDefault();
  const f=ev.target;
  if(f.id==='gateForm'){unlock();return;}
  if(f.id==='feedForm'){feedConnect(document.getElementById('feedUrl').value.trim());return;}
  if(f.id==='taskForm'){const i=document.getElementById('taskInput');const v=i.value.trim();if(!v)return;state.tasks.push({id:Date.now().toString(36),text:v,done:false,by:prefs.me||undefined});save();render();const ni=document.getElementById('taskInput');if(ni)ni.focus();return;}
  if(f.id==='examForm'){
    const g=k=>document.getElementById('e-'+k);const err=g('err');const fail=m=>{err.textContent=m;err.hidden=false;};
    const type=g('type').value;const co=g('course')?g('course').value:'';const title=g('title').value.trim()||co;const date=g('date').value;
    const start=type==='abgabe'?'':g('start').value,end=type==='abgabe'?'':g('end').value,due=type==='abgabe'?g('due').value:'';
    if(!title)return fail('Bitte eintragen, worum es geht.');
    if(!date)return fail('Bitte ein Datum wählen.');
    if(start&&end&&toMin(end)<=toMin(start))return fail('Das Ende muss nach dem Beginn liegen.');
    let subject=g('subject').value;
    if(subject==='__new'){const n=g('catname').value.trim();if(!n)return fail('Bitte der neuen Kategorie einen Namen geben.');
      subject=newCatId();catsEdit().push({id:subject,n,c:document.querySelector('#w-ecat .pcol').value||freeColor()});}
    const data={type,title,course:co,subject,date,start,end,due,room:type==='abgabe'?'':g('room').value.trim(),place:g('place').value.trim(),note:g('note').value.trim(),grade:g('grade').value.trim()};
    state.exams=state.exams||[];const id=g('id').value;
    if(id){const x=state.exams.find(e=>e.id===id);if(x)Object.assign(x,data);}
    else state.exams.push({id:'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),done:false,...data});
    save();closeSheet();if(ui.tab!=='fristen'&&!id)go('fristen');else render();return;
  }
  if(f.id==='catForm'){
    const n=document.getElementById('k-name').value.trim();const err=document.getElementById('k-err');
    if(!n){err.textContent='Bitte einen Namen eingeben.';err.hidden=false;return;}
    const col=card.querySelector('.pcol').value||freeColor();const kid=document.getElementById('k-id').value;const cs=catsEdit();
    if(kid){const x=cs.find(c=>c.id===kid);if(x){x.n=n;x.c=col;}}
    else{const nid=newCatId();cs.push({id:nid,n,c:col});if(ui.catRet&&ui.catRet.course){const c=byId(ui.catRet.course);if(c)setSubject(c,nid);}}
    save();render();catBack();return;
  }
  if(f.id==='setForm'){const v=document.getElementById('s-name').value.trim();const me=book.plans[prefs.me];if(v&&v!==me.name){me.name=v;markDirty(prefs.me);}persist();closeSheet();render();return;}
  if(f.id==='dateForm'){
    const g=k=>document.getElementById('d-'+k);const err=g('err');const fail=m=>{err.textContent=m;err.hidden=false;};
    const title=g('title').value.trim(),date=g('date').value,start=g('start').value,end=g('end').value;
    if(!date)return fail('Bitte ein Datum wählen.');
    if(!start||!end||toMin(end)<=toMin(start))return fail('Das Ende muss nach dem Beginn liegen.');
    const nowMs=Date.now();const id=g('id').value;
    if(id){const it=book.wir.dates.find(x=>x.id===id);if(it){const moved=it.date!==date||it.start!==start||it.end!==end;Object.assign(it,{title,date,start,end,place:g('place').value.trim(),note:g('note').value.trim(),updatedAt:nowMs});it.st=it.st||{};it.st[ME()]={s:'ja',at:nowMs};if(moved)it.st[OTHER()]={s:'offen',at:nowMs};
      notify(OTHER(),'req',moved?'Date verschoben':'Date geändert',`${pname(ME())} hat euer Date geändert: ${shortDate(date)}, ${start} Uhr.`);}}
    else{notify(OTHER(),'req','Neue Date-Anfrage',`${pname(ME())} schlägt ein Date vor: ${shortDate(date)}, ${start} Uhr.`);book.wir.dates.push({id:'d'+nowMs.toString(36)+Math.random().toString(36).slice(2,6),title,date,start,end,place:g('place').value.trim(),note:g('note').value.trim(),by:ME(),st:{[ME()]:{s:'ja',at:nowMs},[OTHER()]:{s:'offen',at:nowMs}},updatedAt:nowMs});}
    saveWir();closeSheet();render();return;
  }
  if(f.id!=='courseForm')return;
  const g=k=>document.getElementById('f-'+k);const err=g('err');
  const ev2=g('every').value;const once=ev2==='once';
  const title=g('title').value.trim(),start=g('start').value,end=g('end').value;
  let from=g('from').value,until=g('until').value,every=once?0:Number(ev2),day=Number(g('day').value);
  const fail=m=>{err.textContent=m;err.hidden=false;};
  if(!title)return fail('Bitte eintragen, was es ist.');
  if(once){const dt=g('date').value;if(!dt)return fail('Bitte ein Datum wählen.');from=until=dt;day=fromIso(dt).getDay();}
  if(!start||!end||toMin(end)<=toMin(start))return fail('Das Ende muss nach dem Beginn liegen.');
  if(!once&&every===0&&(!from||!until))return fail('Für einen Block brauche ich den ersten und den letzten Tag.');
  if(from&&until&&until<from)return fail('Der letzte Tag liegt vor dem ersten.');
  let subject=g('subject').value;
  if(subject==='__new'){const n=g('catname').value.trim();if(!n)return fail('Bitte der neuen Kategorie einen Namen geben.');
    subject=newCatId();catsEdit().push({id:subject,n,c:document.querySelector('#w-newcat .pcol').value||freeColor()});}
  const id=g('id').value;
  const data={title,important:g('imp').checked,subject,kind:g('kind').value,group:g('group').value.trim(),day,start,end,ct:g('ct').checked,room:g('room').value.trim(),place:g('place').value.trim(),lecturer:g('lecturer').value.trim(),from,until,every,status:g('status').value,note:g('note').value.trim()};
  if(id){const c=byId(id);const changedTime=c.start!==start||c.end!==end;Object.assign(c,data);setSubject(c,subject);if(changedTime)delete c.timeUnsure;}
  else state.courses.push({id:'c'+Date.now().toString(36),code:'',hidden:false,...data});
  save();closeSheet();render();
});

/* ---------- Passwort & Start ---------- */
async function unlock(){
  const pw=document.getElementById('gatePw'),err=document.getElementById('gateErr'),form=document.getElementById('gateForm'),btn=document.getElementById('gateBtn');
  btn.disabled=true;btn.textContent='Öffne …';
  try{
    const raw=await deriveRaw(pw.value);const keys=await keysFromRaw(raw);
    const seed=await decryptB64(keys.enc,SEED_ENC.data);
    KEYS=keys;SEED=seed;
    try{localStorage.setItem(KEY+'-raw',hex(raw));localStorage.setItem(KEY+'-seed',JSON.stringify(seed));}catch(e){}
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
    const ids=Object.keys(seed.plans);
    if(ids.length<2){chooseMe(ids[0]);return;}
    form.hidden=true;const w=document.getElementById('gateWho');w.hidden=false;
    document.getElementById('gateWhoBtns').innerHTML=ids.map(id=>`<button type="button" data-action="iam" data-id="${esc(id)}"><i>${esc(seed.plans[id].name.slice(0,1))}</i>${esc(seed.plans[id].name)}</button>`).join('');
  }catch(e){
    btn.disabled=false;btn.textContent='Öffnen';
    err.hidden=false;form.classList.remove('shake');void form.offsetWidth;form.classList.add('shake');pw.select();
  }
}
function chooseMe(id){
  prefs=prefs||{pal:'rose',mode:'auto'};prefs.me=id;prefs.view=id;
  try{localStorage.setItem(KEY+'-prefs',JSON.stringify(prefs));}catch(e){}
  loadAll();persist();document.getElementById('gate').hidden=true;applyPal();render();specialHearts();pull();loadMyangel(true).then(ch=>{if(ch)render();});
}
function specialHearts(){
  const d=new Date();if(!specialDay(d))return;const k=KEY+'-tag-'+iso(d);
  try{if(localStorage.getItem(k))return;localStorage.setItem(k,'1');}catch(e){}
  const h=document.querySelector('.hello h1');if(!h)return;
  for(let i=0;i<6;i++)setTimeout(()=>flyHeart(h),i*180);
}
async function boot(){
  document.querySelectorAll('[data-pixh]').forEach(e=>e.innerHTML=pixHeart());
  if(SEED_ENC){try{const r=localStorage.getItem(KEY+'-raw');if(r)KEYS=await keysFromRaw(unhex(r));}catch(e){KEYS=null;}}
  if((!SEED_ENC||KEYS)&&loadAll()){applyPal();render();specialHearts();pull();loadMyangel(true).then(ch=>{if(ch)render();scheduleReminders();});scheduleReminders();return;}
  prefs={me:null,view:null,pal:'rose',mode:'auto'};
  document.getElementById('gate').hidden=false;setTimeout(()=>{const p=document.getElementById('gatePw');if(p)p.focus();},50);
}
boot();
